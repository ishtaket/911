name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: pytest -q

  android-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate gradle config
        run: |
          ls -la
          echo "Wrapper jar present? $(test -f gradle/wrapper/gradle-wrapper.jar && echo yes || echo no)"
          echo "Gradle build files exist."
          # Full gradle build is gated on having an Android SDK + the wrapper jar.
          # CI will materialize them in a follow-up workflow.
