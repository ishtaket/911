name: PCA Android CI

# Builds and unit-tests the Personal Context Assistant module
# (pca-android/). Runs in parallel to the Rescue911 CI defined in ci.yml.

on:
  push:
    paths:
      - 'pca-android/**'
      - '.github/workflows/pca-ci.yml'
  pull_request:
    paths:
      - 'pca-android/**'
      - '.github/workflows/pca-ci.yml'

# - contents: write — for the rolling pca-latest release publish step
# - pull-requests: write — for the diagnostic "comment last lines of
#   build log on failure" step so a reviewer reading the PR can see the
#   error without drilling into the Actions log UI.
permissions:
  contents: write
  pull-requests: write

jobs:
  pca-build:
    name: pca-android · assembleDebug + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      # CMake's FetchContent clones whisper.cpp v1.7.1 on first configure;
      # make sure git is present and configured to follow redirects without
      # asking for credentials.
      - name: Verify git for CMake FetchContent
        run: |
          git --version
          git config --global http.followRedirects true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pca-gradle-${{ runner.os }}-${{ hashFiles('pca-android/**/*.gradle*', 'pca-android/gradle/wrapper/gradle-wrapper.properties', 'pca-android/gradle/libs.versions.toml') }}
          restore-keys: |
            pca-gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x pca-android/gradlew

      - name: Run unit tests
        id: unit_tests
        working-directory: pca-android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon --stacktrace 2>&1 | tee /tmp/pca-unit-tests.log

      - name: Assemble debug APK
        id: assemble
        working-directory: pca-android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain --no-daemon --stacktrace 2>&1 | tee /tmp/pca-assemble.log

      # Diagnostic: when either Gradle step fails, copy the tail of the
      # combined logs into a PR comment so the failure is readable
      # straight from the PR conversation without drilling into the
      # Actions log viewer (which is hard to navigate on mobile and
      # requires the right GitHub auth scope).
      - name: Post build-failure summary to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          {
            echo "## ❌ pca-android CI failure"
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            for log in /tmp/pca-unit-tests.log /tmp/pca-assemble.log; do
              [ -f "$log" ] || continue
              echo "### $(basename "$log") — Kotlin compile errors"
              echo
              echo '```'
              # Kotlin emits compile errors as:
              #   e: file:///path/...kt:LINE:COL <msg>
              # Plus AGP / Hilt sometimes use plain "error:" prefix.
              # Grab 3 lines of context around each match.
              grep -nE "^e: file://|^error:|FAILURE:|What went wrong|Unresolved reference|Type mismatch|cannot find symbol|symbol:|^> Task .* FAILED|Build cancelled" "$log" \
                | head -200 \
                || echo "(no Kotlin compile-error patterns matched; see full tail below)"
              echo '```'
              echo
              echo "### $(basename "$log") — last 400 lines"
              echo
              echo '```'
              tail -n 400 "$log"
              echo '```'
              echo
            done
          } > /tmp/pca-failure-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/pca-failure-comment.md \
            --repo "${{ github.repository }}"

      - name: Upload debug APK (Actions artifact — requires GitHub login to download)
        uses: actions/upload-artifact@v4
        with:
          name: pca-app-debug
          path: pca-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pca-unit-test-report
          path: pca-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Public rolling release. Anyone — logged in or not — can download
      # from https://github.com/<owner>/<repo>/releases/download/pca-latest/app-debug.apk
      # This is the link to put in the install instructions for the phone:
      # no GitHub login, no ZIP unpacking, just tap-and-install.
      #
      # Runs ONLY on push (not on PRs), and only on the build branch the
      # user actually installs from, so PR builds don't overwrite the
      # rolling release.
      # ------------------------------------------------------------------
      - name: Rename APK with branch + commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/build-samsung-app-YaU0S'
        run: |
          mkdir -p release-staging
          cp pca-android/app/build/outputs/apk/debug/app-debug.apk \
             release-staging/app-debug.apk
          # Also include a checksum so users can verify integrity.
          (cd release-staging && sha256sum app-debug.apk > app-debug.apk.sha256)
          # And a small build-info file for traceability.
          cat > release-staging/BUILD_INFO.txt <<EOF
          PCA debug APK
          ====================
          Branch:   ${{ github.ref_name }}
          Commit:   ${{ github.sha }}
          Workflow: ${{ github.run_id }}
          Built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Publish rolling pca-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/build-samsung-app-YaU0S'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pca-latest
          name: PCA debug — latest build
          body: |
            **This release auto-updates on every push to `claude/build-samsung-app-YaU0S`.**

            Direct phone-friendly downloads:

            * APK: https://github.com/${{ github.repository }}/releases/download/pca-latest/app-debug.apk
            * SHA-256: https://github.com/${{ github.repository }}/releases/download/pca-latest/app-debug.apk.sha256
            * Build info: https://github.com/${{ github.repository }}/releases/download/pca-latest/BUILD_INFO.txt

            Build: workflow run `${{ github.run_id }}` from commit `${{ github.sha }}`.
          files: |
            release-staging/app-debug.apk
            release-staging/app-debug.apk.sha256
            release-staging/BUILD_INFO.txt
          prerelease: true
          make_latest: false
          # Overwrite the existing `pca-latest` tag/release each push.
          # softprops/action-gh-release handles "tag exists" idempotently
          # when given the same tag_name.
          fail_on_unmatched_files: true
