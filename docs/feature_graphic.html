<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #D84315 0%, #BF360C 40%, #1A1A1A 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .container {
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 0 80px;
    width: 100%;
  }
  .left {
    flex: 1;
  }
  .logo {
    width: 90px;
    height: 90px;
    background: white;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .logo svg {
    width: 56px;
    height: 56px;
  }
  h1 {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .tagline {
    font-size: 20px;
    font-weight: 400;
    opacity: 0.9;
    line-height: 1.5;
    max-width: 420px;
  }
  .right {
    position: relative;
    width: 220px;
    height: 400px;
    flex-shrink: 0;
  }
  .phone {
    width: 200px;
    height: 400px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden;
    position: absolute;
  }
  .phone-1 { top: 0; left: 0; z-index: 2; }
  .phone-2 { top: 30px; left: 60px; z-index: 1; opacity: 0.7; transform: scale(0.92); }
  .phone-header {
    background: #D84315;
    padding: 16px 16px 12px;
    color: white;
  }
  .phone-header-sm { font-size: 9px; opacity: 0.8; }
  .phone-header h3 { font-size: 14px; font-weight: 600; }
  .phone-body { padding: 10px 12px; }
  .card {
    background: #f5f0f0;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .card-title { font-size: 10px; color: #D84315; font-weight: 600; margin-bottom: 4px; }
  .card-text { font-size: 8px; color: #333; line-height: 1.4; }
  .action-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }
  .action-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-orange { background: #D84315; }
  .dot-green { background: #00897B; }
  .dot-amber { background: #FF8F00; }
  .action-label { font-size: 8px; color: #333; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    margin-top: 20px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">
        <svg viewBox="0 0 56 56" fill="none">
          <circle cx="24" cy="22" r="14" stroke="#D84315" stroke-width="3.5" fill="none"/>
          <line x1="34" y1="32" x2="48" y2="46" stroke="#D84315" stroke-width="4" stroke-linecap="round"/>
          <circle cx="24" cy="18" r="5" fill="#D84315"/>
          <path d="M16 28 C16 24 20 21 24 21 C28 21 32 24 32 28" stroke="#D84315" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1>SearchAid</h1>
      <div class="tagline">
        Find missing loved ones faster.<br>
        Digital leads. Smart zones. Real-time coordination.
      </div>
      <div class="badge">For families &amp; volunteers</div>
    </div>
    <div class="right">
      <div class="phone phone-1">
        <div class="phone-header">
          <div class="phone-header-sm">ACTIVE CASE</div>
          <h3>Maria Ivanova</h3>
        </div>
        <div class="phone-body">
          <div class="card">
            <div class="card-title">Case Info</div>
            <div class="card-text">
              Last seen: Central Park<br>
              74 y.o. · Alzheimer's
            </div>
          </div>
          <div class="card-title" style="padding: 4px 0; color: #D84315; font-size: 9px; font-weight: 600;">Actions</div>
          <div class="action-row">
            <div class="action-dot dot-orange"></div>
            <div class="action-label">Search Map</div>
          </div>
          <div class="action-row">
            <div class="action-dot dot-green"></div>
            <div class="action-label">Search Leads</div>
          </div>
          <div class="action-row">
            <div class="action-dot dot-amber"></div>
            <div class="action-label">Witness Reports</div>
          </div>
          <div class="action-row" style="border: none;">
            <div class="action-dot dot-orange"></div>
            <div class="action-label">Web Search</div>
          </div>
        </div>
      </div>
      <div class="phone phone-2">
        <div class="phone-header">
          <div class="phone-header-sm">SEARCH</div>
          <h3>Search Map</h3>
        </div>
        <div class="phone-body">
          <div style="background: #e8e0d8; height: 200px; border-radius: 8px; position: relative;">
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; background:rgba(216,67,21,0.2); border-radius:50%; border:2px solid #D84315;"></div>
            <div style="position:absolute; top:35%; left:35%; width:40px; height:40px; background:rgba(0,137,123,0.15); border-radius:50%; border:2px solid #00897B;"></div>
            <div style="position:absolute; top:60%; left:60%; width:8px; height:8px; background:#FF8F00; border-radius:50%;"></div>
            <div style="position:absolute; top:40%; left:55%; width:8px; height:8px; background:#D84315; border-radius:50%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
