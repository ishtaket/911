name: rescue911-local

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rescue911-postgres
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osint"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: rescue911-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: rescue911-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rescue911-backend
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://osint:osint@postgres:5432/osint
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: osint-cases
      MOCK_PROVIDERS: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8000:8000"
    profiles: ["full"]   # opt-in: scripts can `docker compose --profile full up -d`

  # Optional services — opt in with `--profile search` or `--profile vector`
  opensearch:
    image: opensearchproject/opensearch:2.16.0
    container_name: rescue911-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ChangeMe-Local-1!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    profiles: ["search"]

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: rescue911-qdrant
    ports:
      - "6333:6333"
    profiles: ["vector"]

volumes:
  postgres-data:
  minio-data:
